<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- Ashoka Lion Emblem (National Emblem of India) -->
  <g transform="translate(160, 48) scale(0.6)" fill="#B48235" stroke="#8A5A1B" stroke-width="0.5">
    <!-- Emblem base & abacus -->
    <path d="M-40,55 L40,55 L35,62 L-35,62 Z" fill="#996E2E"/>
    <ellipse cx="0" cy="55" rx="36" ry="4" fill="#B48235"/>
    <ellipse cx="0" cy="46" rx="30" ry="3" fill="#D4A74F"/>
    <!-- Ashoka Chakra on abacus -->
    <circle cx="0" cy="51" r="5" fill="none" stroke="#0B2341" stroke-width="1.2"/>
    <circle cx="0" cy="51" r="1.5" fill="#0B2341"/>
    <!-- Lions representation -->
    <!-- Center Lion -->
    <path d="M-14,20 C-16,8 -12,-5 0,-10 C12,-5 16,8 14,20 C18,24 16,34 12,42 C8,45 -8,45 -12,42 C-16,34 -18,24 -14,20 Z" fill="#C5933C"/>
    <!-- Lion Mane & Face details -->
    <path d="M-8,-4 C-4,-8 4,-8 8,-4 C10,2 10,12 8,18 C6,22 -6,22 -8,18 C-10,12 -10,2 -8,-4 Z" fill="#DFB762"/>
    <circle cx="-3" cy="2" r="1.5" fill="#422E0F"/>
    <circle cx="3" cy="2" r="1.5" fill="#422E0F"/>
    <path d="M-3,8 Q0,11 3,8" stroke="#422E0F" stroke-width="1.2" fill="none"/>
    <!-- Left Lion (Profile) -->
    <path d="M-12,18 C-20,12 -26,20 -28,32 C-26,40 -18,44 -12,42" fill="#B48235"/>
    <!-- Right Lion (Profile) -->
    <path d="M12,18 C20,12 26,20 28,32 C26,40 18,44 12,42" fill="#B48235"/>
    <!-- Satyameva Jayate Banner -->
    <text x="0" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#5A3E14" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>
  </g>

  <!-- MSME Bold Stylized Text -->
  <g transform="translate(40, 112)">
    <!-- Letter M (outer left) -->
    <path d="M 0,42 L 0,0 L 12,0 L 12,32 L 20,32 L 20,0 L 32,0 L 32,32 L 40,32 L 40,0 L 52,0 L 52,42 Z" fill="#1B1B1B"/>
    <!-- Letter S -->
    <path d="M 64,0 L 112,0 L 112,11 L 78,11 L 78,16 L 112,16 L 112,42 L 64,42 L 64,31 L 98,31 L 98,26 L 64,26 Z" fill="#1B1B1B"/>
    <!-- Letter M -->
    <path d="M 124,42 L 124,0 L 136,0 L 136,32 L 144,32 L 144,0 L 156,0 L 156,32 L 164,32 L 164,0 L 176,0 L 176,42 Z" fill="#1B1B1B"/>
    <!-- Letter E -->
    <path d="M 188,0 L 236,0 L 236,11 L 202,11 L 202,16 L 230,16 L 230,26 L 202,26 L 202,31 L 236,31 L 236,42 L 188,42 Z" fill="#1B1B1B"/>
  </g>

  <!-- Hindi Tagline: सूक्ष्म, लघु एवं मध्यम उद्यम -->
  <text x="160" y="176" font-family="'Noto Sans Devanagari', 'Mangal', 'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B1B1B" text-anchor="middle" letter-spacing="0.5">
    सूक्ष्म, लघु एवं मध्यम उद्यम
  </text>

  <!-- English Tagline: MICRO, SMALL & MEDIUM ENTERPRISES -->
  <text x="160" y="196" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="900" fill="#1B1B1B" text-anchor="middle" letter-spacing="0.8">
    MICRO, SMALL &amp; MEDIUM ENTERPRISES
  </text>
</svg>
