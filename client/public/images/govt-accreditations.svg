<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <!-- IAF Gradients -->
    <radialGradient id="combIafGlobeGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4B9FE1"/>
      <stop offset="45%" stop-color="#1B6CB0"/>
      <stop offset="85%" stop-color="#0F4C82"/>
      <stop offset="100%" stop-color="#093158"/>
    </radialGradient>
    <linearGradient id="combIafBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E70B8"/>
      <stop offset="100%" stop-color="#0B3766"/>
    </linearGradient>
    <path id="combTopArc" d="M 360,110 A 120,85 0 0,1 600,110" fill="none" />
    <path id="combBottomArc" d="M 605,110 A 125,90 0 0,1 355,110" fill="none" />

    <!-- AICTE Gear Gradient -->
    <radialGradient id="combAicteGearGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD78"/>
      <stop offset="70%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <path id="combAicteTopPath" d="M 690,110 A 62,62 0 0,1 910,110" fill="none" />
  </defs>

  <!-- 1. MSME LOGO (LEFT: X=160) -->
  <g transform="translate(0, 0)">
    <!-- Ashoka Lion Emblem -->
    <g transform="translate(160, 48) scale(0.6)" fill="#B48235" stroke="#8A5A1B" stroke-width="0.5">
      <path d="M-40,55 L40,55 L35,62 L-35,62 Z" fill="#996E2E"/>
      <ellipse cx="0" cy="55" rx="36" ry="4" fill="#B48235"/>
      <ellipse cx="0" cy="46" rx="30" ry="3" fill="#D4A74F"/>
      <circle cx="0" cy="51" r="5" fill="none" stroke="#0B2341" stroke-width="1.2"/>
      <circle cx="0" cy="51" r="1.5" fill="#0B2341"/>
      <path d="M-14,20 C-16,8 -12,-5 0,-10 C12,-5 16,8 14,20 C18,24 16,34 12,42 C8,45 -8,45 -12,42 C-16,34 -18,24 -14,20 Z" fill="#C5933C"/>
      <path d="M-8,-4 C-4,-8 4,-8 8,-4 C10,2 10,12 8,18 C6,22 -6,22 -8,18 C-10,12 -10,2 -8,-4 Z" fill="#DFB762"/>
      <circle cx="-3" cy="2" r="1.5" fill="#422E0F"/>
      <circle cx="3" cy="2" r="1.5" fill="#422E0F"/>
      <path d="M-3,8 Q0,11 3,8" stroke="#422E0F" stroke-width="1.2" fill="none"/>
      <path d="M-12,18 C-20,12 -26,20 -28,32 C-26,40 -18,44 -12,42" fill="#B48235"/>
      <path d="M12,18 C20,12 26,20 28,32 C26,40 18,44 12,42" fill="#B48235"/>
      <text x="0" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#5A3E14" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>
    </g>

    <!-- MSME Bold Stylized Text -->
    <g transform="translate(40, 112)">
      <path d="M 0,42 L 0,0 L 12,0 L 12,32 L 20,32 L 20,0 L 32,0 L 32,32 L 40,32 L 40,0 L 52,0 L 52,42 Z" fill="#1B1B1B"/>
      <path d="M 64,0 L 112,0 L 112,11 L 78,11 L 78,16 L 112,16 L 112,42 L 64,42 L 64,31 L 98,31 L 98,26 L 64,26 Z" fill="#1B1B1B"/>
      <path d="M 124,42 L 124,0 L 136,0 L 136,32 L 144,32 L 144,0 L 156,0 L 156,32 L 164,32 L 164,0 L 176,0 L 176,42 Z" fill="#1B1B1B"/>
      <path d="M 188,0 L 236,0 L 236,11 L 202,11 L 202,16 L 230,16 L 230,26 L 202,26 L 202,31 L 236,31 L 236,42 L 188,42 Z" fill="#1B1B1B"/>
    </g>
    <text x="160" y="176" font-family="'Noto Sans Devanagari', 'Mangal', 'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B1B1B" text-anchor="middle" letter-spacing="0.5">
      सूक्ष्म, लघु एवं मध्यम उद्यम
    </text>
    <text x="160" y="196" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="900" fill="#1B1B1B" text-anchor="middle" letter-spacing="0.8">
      MICRO, SMALL &amp; MEDIUM ENTERPRISES
    </text>
  </g>

  <!-- 2. IAF LOGO (CENTER: X=480) -->
  <g transform="translate(480, 110)">
    <ellipse cx="0" cy="0" rx="146" ry="98" fill="url(#combIafBorderGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="138" ry="90" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="114" ry="74" fill="url(#combIafGlobeGrad)" stroke="#FFFFFF" stroke-width="2" />

    <path d="M -114,0 Q 0,-32 114,0" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65" />
    <path d="M -114,0 Q 0,32 114,0" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65" />
    <path d="M -102,-32 Q 0,-52 102,-32" fill="none" stroke="#FFFFFF" stroke-width="0.85" opacity="0.55" />
    <path d="M -102,32 Q 0,52 102,32" fill="none" stroke="#FFFFFF" stroke-width="0.85" opacity="0.55" />

    <path d="M 0,-74 L 0,74" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65" />
    <path d="M 0,-74 Q -48,0 0,74" fill="none" stroke="#FFFFFF" stroke-width="0.85" opacity="0.55" />
    <path d="M 0,-74 Q 48,0 0,74" fill="none" stroke="#FFFFFF" stroke-width="0.85" opacity="0.55" />
    <path d="M 0,-74 Q -85,0 0,74" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.45" />
    <path d="M 0,-74 Q 85,0 0,74" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.45" />

    <text x="0" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" style="filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.45));">
      IAF
    </text>
  </g>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">
    <textPath href="#combTopArc" startOffset="50%" text-anchor="middle">
      MEMBER OF MULTILATERAL
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#combBottomArc" startOffset="50%" text-anchor="middle">
      RECOGNITION ARRANGEMENT
    </textPath>
  </text>

  <!-- 3. AICTE LOGO (RIGHT: X=800) -->
  <g transform="translate(800, 110)">
    <g fill="url(#combAicteGearGrad)" stroke="#B45309" stroke-width="1.5">
      <path d="
        M -24,-92 L 24,-92 L 18,-76 L -18,-76 Z
        M 56,-74 L 88,-44 L 72,-34 L 46,-58 Z
        M 92,-24 L 92,24 L 76,18 L 76,-18 Z
        M 88,44 L 56,74 L 46,58 L 72,34 Z
        M 24,92 L -24,92 L -18,76 L 18,76 Z
        M -56,74 L -88,44 L -72,34 L -46,58 Z
        M -92,24 L -92,-24 L -76,-18 L -76,18 Z
        M -88,-44 L -56,-74 L -46,-58 L -72,-34 Z
        M 24,-92 A 80,80 0 1,1 -24,-92 Z
      " />
      <circle cx="0" cy="0" r="78" fill="url(#combAicteGearGrad)" stroke="#B45309" stroke-width="1.5"/>
    </g>

    <circle cx="0" cy="0" r="66" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5" />
    <text x="0" y="-28" font-family="'Noto Sans Devanagari', 'Mangal', 'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="bold" fill="#78350F" text-anchor="middle" letter-spacing="0.5">
      योगः कर्मसु कौशलम्
    </text>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#DC2626" text-anchor="middle" letter-spacing="1.5" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.2));">
      AICTE
    </text>

    <circle cx="0" cy="36" r="22" fill="#1E3A8A" stroke="#B45309" stroke-width="1.2"/>
    <ellipse cx="0" cy="46" rx="12" ry="4" fill="#E2E8F0"/>
    <path d="M -11,46 C -11,38 11,38 11,46 Z" fill="#93C5FD"/>
    <path d="M -8,42 Q 0,46 8,42 Q 0,38 -8,42 Z" fill="#F59E0B"/>
    <path d="M 0,22 C -6,30 -4,37 0,40 C 4,37 6,30 0,22 Z" fill="#EF4444"/>
    <path d="M 0,26 C -3,31 -2,36 0,38 C 2,36 3,31 0,26 Z" fill="#FDE047"/>
  </g>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#1E3A8A" letter-spacing="0.5">
    <textPath href="#combAicteTopPath" startOffset="50%" text-anchor="middle">
      All India Council for Technical Education
    </textPath>
  </text>
</svg>
